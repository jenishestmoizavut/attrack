name: Production Launch Tester Announcer

on:
  schedule:
    # Checks every 30 minutes in the cloud
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      force_send:
        description: 'Force send emails right now (bypass Play Store check)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  check_and_notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Announcer Script
        id: announcer
        env:
          LAUNCH_SECRET: ${{ secrets.LAUNCH_SECRET }}
          FORCE_SEND: ${{ inputs.force_send }}
        run: |
          python scripts/notify_testers.py

      - name: Record Dispatch Marker in Git
        if: steps.announcer.outputs.sent == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state/launch_notified.json
          git commit -m "chore: record production launch email dispatch [skip ci]"
          git push
